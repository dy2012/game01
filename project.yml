name: MergeDaily
options:
  bundleIdPrefix: com.dy2012
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2J4HWPU724
targets:
  MergeDaily:
    type: application
    platform: iOS
    sources:
      - path: MergeDaily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dy2012.mergehehe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 每日合合
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone，免除 iPad 分屏的方向要求
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MergeDailyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MergeDailyTests
    dependencies:
      - target: MergeDaily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dy2012.mergeheheTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MergeDaily:
    build:
      targets:
        MergeDaily: all
    test:
      targets:
        - MergeDailyTests
